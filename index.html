<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント施策投稿フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9ff; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .accent-purple { background-color: #f3f0ff; border: 1px solid #e9e4ff; }
        input[type="radio"]:checked + span { background-color: #8b5cf6; color: white; border-color: #8b5cf6; }
        .loading { opacity: 0.5; pointer-events: none; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .success-overlay { animation: popIn 0.3s ease-out; }

        /* 追加：タブのデザイン */
        .tab-btn { position: relative; transition: all 0.3s; }
        .tab-active { color: #8b5cf6 !important; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: #8b5cf6; border-radius: 3px; }
    </style>
</head>
<body class="p-4 pb-12">

    <div id="app" class="max-w-md mx-auto relative">
        
        <div class="flex mb-6 border-b border-gray-200 sticky top-0 bg-[#f8f9ff]/90 backdrop-blur-sm z-30">
            <button type="button" id="btn-post" onclick="toggleView('post')" class="tab-btn flex-1 py-4 font-bold text-gray-400 tab-active">
                <i class="fa-solid fa-pen-to-square mr-1"></i> 投稿する
            </button>
            <button type="button" id="btn-view" onclick="toggleView('view')" class="tab-btn flex-1 py-4 font-bold text-gray-400">
                <i class="fa-solid fa-layer-group mr-1"></i> 閲覧する
            </button>
        </div>

        <div id="successMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-white/90 backdrop-blur-sm">
            <div class="success-overlay bg-white p-8 rounded-3xl card-shadow border border-purple-100 text-center w-full max-w-xs">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">送信完了！</h2>
                <p class="text-sm text-gray-500 mb-6">施策内容を無事に保存しました。</p>
                <button onclick="resetForm()" class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold shadow-md">続けて投稿する</button>
            </div>
        </div>

        <div id="view-post" class="space-y-4">
            <div class="mb-6 flex items-center gap-2 text-lg font-bold text-gray-700">
                <span class="text-pink-500">📌</span>
                <h1>施策内容の登録</h1>
            </div>

            <form id="promoForm" class="space-y-4">
                <div class="bg-white p-5 rounded-2xl card-shadow border border-gray-100 space-y-3">
                    <div class="flex items-center gap-2 mb-1 font-bold text-gray-800 text-sm">
                        <i class="fa-solid fa-user-pen text-blue-400"></i> 基本情報
                    </div>
                    <input type="text" id="staff_name" placeholder="お名前" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm" required>
                    <input type="text" id="event_name" placeholder="イベント名" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm" required>
                    <input type="text" id="store_name" placeholder="店舗名・会場" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm">
                </div>

                <div class="accent-purple p-5 rounded-3xl card-shadow space-y-4">
                    <div class="flex items-center gap-2 font-bold text-gray-800 text-sm"><span>🎁</span> 特典・券面設定</div>
                    <div class="space-y-3">
                        <p class="text-xs font-bold text-gray-600 px-1">コンテンツ関連の券面はある？</p>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer"><input type="radio" name="has_special_design" value="true" class="hidden"><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium">あり</span></label>
                            <label class="cursor-pointer"><input type="radio" name="has_special_design" value="false" class="hidden" checked><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium">なし</span></label>
                        </div>
                        <p class="text-xs font-bold text-gray-600 px-1 mt-3">カード入会特典はある？</p>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer"><input type="radio" name="has_signup_bonus" value="true" class="hidden"><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium">あり</span></label>
                            <label class="cursor-pointer"><input type="radio" name="has_signup_bonus" value="false" class="hidden" checked><span class="block text-center p-3 bg-white border border-gray-200 rounded-xl text-sm font-medium">なし</span></label>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl card-shadow border border-gray-100 overflow-hidden">
                    <div class="p-4">
                        <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-comment-dots text-orange-400"></i> フック内容</label>
                        <textarea id="hook_content" rows="3" placeholder="最初の声掛け" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm"></textarea>
                    </div>
                    <div class="bg-gray-50 p-3 border-t border-dashed border-gray-200">
                        <label class="flex items-center justify-center gap-2 cursor-pointer py-2 px-4 bg-white border border-gray-300 rounded-lg text-xs font-bold text-gray-600">
                            <i class="fa-solid fa-camera"></i> 写真を追加
                            <input type="file" id="hook_image" accept="image/*" class="hidden">
                        </label>
                        <div id="hook_preview" class="hidden mt-2 text-[10px] text-blue-500 text-center font-bold">画像セット完了</div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl card-shadow border border-gray-100 overflow-hidden">
                    <div class="p-4">
                        <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-bullhorn text-green-400"></i> ひきこみ内容</label>
                        <textarea id="pitch_content" rows="3" placeholder="メリットの伝え方" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm"></textarea>
                    </div>
                    <div class="bg-gray-50 p-3 border-t border-dashed border-gray-200">
                        <label class="flex items-center justify-center gap-2 cursor-pointer py-2 px-4 bg-white border border-gray-300 rounded-lg text-xs font-bold text-gray-600">
                            <i class="fa-solid fa-image"></i> 写真を追加
                            <input type="file" id="pitch_image" accept="image/*" class="hidden">
                        </label>
                        <div id="pitch_preview" class="hidden mt-2 text-[10px] text-blue-500 text-center font-bold">画像セット完了</div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl card-shadow border border-gray-100">
                    <textarea id="memo" rows="2" placeholder="ほかになにかあれば" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">登録する</button>
            </form>
        </div>

        <div id="view-gallery" class="hidden space-y-4">
            <div class="mb-4 flex items-center justify-between">
                <div class="flex items-center gap-2 text-lg font-bold text-gray-700">
                    <span class="text-yellow-500">🏆</span>
                    <h1>みんなの施策ランキング</h1>
                </div>
            </div>
            <div id="ranking-container" class="space-y-4 pb-20">
                </div>
        </div>

    </div>

    <script>
        // ダミーデータ
        let posts = [
            { id: 1, staff_name: "田中", event_name: "夏祭り", store_name: "渋谷", hook_content: "「この特典、今だけです！」", pitch_content: "具体例を提示", likes: 15 },
            { id: 2, staff_name: "佐藤", event_name: "新生活", store_name: "新宿", hook_content: "「もったいないですよ！」", pitch_content: "還元率を説明", likes: 28 },
            { id: 3, staff_name: "鈴木", event_name: "展示会", store_name: "池袋", hook_content: "「画面綺麗ですね」", pitch_content: "補償を提案", likes: 10 }
        ];

        // ページ切り替え（ここを確実に動かす！）
        function toggleView(target) {
            const vPost = document.getElementById('view-post');
            const vGallery = document.getElementById('view-gallery');
            const bPost = document.getElementById('btn-post');
            const bView = document.getElementById('btn-view');

            if (target === 'post') {
                vPost.classList.remove('hidden');
                vGallery.classList.add('hidden');
                bPost.classList.add('tab-active');
                bView.classList.remove('tab-active');
            } else {
                vPost.classList.add('hidden');
                vGallery.classList.remove('hidden');
                bPost.classList.remove('tab-active');
                bView.classList.add('tab-active');
                renderRanking(); // 閲覧ページを表示するときに描画
            }
        }

        // ランキング描画
        function renderRanking() {
            const container = document.getElementById('ranking-container');
            if (!container) return;
            container.innerHTML = '';

            // 評価順にソート
            const sorted = [...posts].sort((a, b) => b.likes - a.likes);

            sorted.forEach((p, idx) => {
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '📄';
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl card-shadow border border-gray-100";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[10px] bg-purple-50 text-purple-600 px-2 py-0.5 rounded-full font-bold">${p.event_name}</span>
                            <h2 class="font-bold text-gray-800 mt-1">${medal} ${p.staff_name} <span class="text-xs text-gray-400 font-normal">@${p.store_name}</span></h2>
                        </div>
                        <button onclick="likePost(${p.id})" class="flex flex-col items-center hover:scale-110 transition-transform">
                            <i class="fa-solid fa-heart text-pink-500 text-xl"></i>
                            <span class="text-[10px] font-bold text-gray-500">${p.likes}</span>
                        </button>
                    </div>
                    <div class="space-y-2 text-sm text-gray-700">
                        <div class="p-3 bg-orange-50 rounded-xl"><p class="text-[10px] font-bold text-orange-400 mb-1">🪝 フック</p><p>${p.hook_content}</p></div>
                        <div class="p-3 bg-green-50 rounded-xl"><p class="text-[10px] font-bold text-green-400 mb-1">📢 ひきこみ</p><p>${p.pitch_content}</p></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // いいね機能
        window.likePost = function(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.likes++;
                renderRanking();
            }
        };

        // フォーム処理
        const form = document.getElementById('promoForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // 投稿内容をダミーデータへ追加
            const newPost = {
                id: Date.now(),
                staff_name: document.getElementById('staff_name').value,
                event_name: document.getElementById('event_name').value,
                store_name: document.getElementById('store_name').value,
                hook_content: document.getElementById('hook_content').value,
                pitch_content: document.getElementById('pitch_content').value,
                likes: 0
            };
            posts.push(newPost);
            document.getElementById('successMessage').classList.remove('hidden');
        });

        // 画像プレビューの安全な処理
        ['hook_image', 'pitch_image'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', () => {
                    document.getElementById(`${id}_preview`)?.classList.remove('hidden');
                });
            }
        });

        window.resetForm = function() {
            form.reset();
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('hook_preview').classList.add('hidden');
            document.getElementById('pitch_preview').classList.add('hidden');
        };

    </script>
</body>
</html>
